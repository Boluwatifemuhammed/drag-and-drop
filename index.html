<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Drag and Drop</title>
</head>
<body>
    <div class="container">
        <h1>Drag and Drop board</h1>

        <div class="board-cont">
            
            <div class="list" id="list1">
                <h2>To Do</h2>
                <div class="card" draggable="true" id="card1">Wash the car</div>
                <div class="card" draggable="true" id="card2">Cook the dishes</div>
                <div class="card" draggable="true" id="card3">Clean the house</div>
            </div>

            <div class="list" id="list2">
                <h2>In Progress</h2>
                <div class="card" draggable="true" id="card4">Go to the market</div>
            </div>

            <div class="list" id="list3">
                <h2>Completed</h2>
                <div class="card" draggable="true" id="card5">Take a nap</div>
            </div>

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
